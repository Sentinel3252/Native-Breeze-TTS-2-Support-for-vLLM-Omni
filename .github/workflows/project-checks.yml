name: Project checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone:
    name: Standalone checks (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Check source and documentation
        run: python scripts/check_project.py
      - name: Test standalone tooling
        run: python -m unittest discover -s tests -v
      - name: Build source archive
        run: python scripts/package_source.py

  core:
    name: CPU core (Transformers ${{ matrix.transformers }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        transformers: ['4.57.3', '5.10.1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU tensor and test dependencies
        run: |
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==${{ matrix.transformers }} 'pytest>=8,<10'
      - name: Test numerical core and runtime callbacks
        run: python -m pytest tests/core -q

# Full-checkpoint serving remains a separate Linux/CUDA validation gate.
